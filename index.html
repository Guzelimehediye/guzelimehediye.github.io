<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyi ki Doğdun ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #ff4e50, #fc913a);
    height: 100vh;
    overflow: hidden;
    color: white;
    text-align: center;
}

.container {
    position: relative;
    top: 50%;
    transform: translateY(-50%);
}

h1 {
    font-size: 3em;
    margin-bottom: 20px;
}

p {
    font-size: 1.2em;
    max-width: 600px;
    margin: auto;
}

button {
    margin-top: 30px;
    padding: 15px 30px;
    font-size: 1em;
    border: none;
    border-radius: 30px;
    background: white;
    color: #ff4e50;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

.hidden {
    display: none;
}

/* Video */
#videoContainer iframe {
    border-radius: 15px;
    margin-top: 20px;
}

/* Kalpler */
.heart {
    position: absolute;
    bottom: -50px;
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-100vh); opacity: 0; }
}
</style>

</head>
<body>

<div class="container">
    <h1>İyi ki Doğdun birtanem ❤️</h1>
    <p>Bugün dünyaya gelen en güzel şey… sensin.</p>
    
    <button onclick="showMessage()">Tıkla 🎁</button>

    <div id="surprise" class="hidden">
        <h2>Sana Bir Mesajım Var...</h2>
        <p>
            Hayatımda olduğun için her gün şükrediyorum.  
            Sen sadece sevgilim değil, en iyi dostumsun  
            İyi ki varsın… iyi ki benimlesin yavrummmm ❤️
        </p>

        <button onclick="playVideo()">Videoyu Aç 🎬</button>

        <!-- VIDEO ALANI -->
        <div id="videoContainer" class="hidden">
            <iframe id="ytVideo" width="900" height="510"
                src=""
                frameborder="0"
                allow="autoplay; encrypted-media"
                allowfullscreen>
            </iframe>
        </div>

    </div>
</div>

<script>
function showMessage() {
    document.getElementById("surprise").classList.remove("hidden");
}

function playVideo() {
    const video = document.getElementById("ytVideo");
    const container = document.getElementById("videoContainer");

    video.src = "https://www.youtube.com/embed/QhwRyFdBN8Q?autoplay=1";
    container.classList.remove("hidden");
}

// Kalp üretici
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
